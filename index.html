
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>موقعي الجميل</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  color: white;
  text-align: center;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.box {
  padding: 30px;
  border-radius: 20px;
  background: rgba(255,255,255,0.1);
  box-shadow: 0 0 25px rgba(0,0,0,0.3);
  width: 85%;
  max-width: 400px;
}

h1 {
  color: #00e5ff;
}

#clock {
  font-size: 35px;
  margin: 25px;
  font-weight: bold;
}

button {
  background: #00e5ff;
  color: #003344;
  border: none;
  padding: 15px 25px;
  border-radius: 12px;
  font-size: 18px;
  margin: 10px;
  cursor: pointer;
}

button:hover {
  transform: scale(1.05);
}
</style>
</head>

<body>

<div class="box">
  <h1>🌟 مرحباً بك في موقعي</h1>
  <p>هذا أول موقع إلكتروني أصنعه!</p>

  <div id="clock">00:00:00</div>

  <button onclick="changeColor()">🎨 تغيير اللون</button>
</div>

<script>
function updateClock() {
  let now = new Date();
  document.getElementById("clock").textContent =
    now.toLocaleTimeString("ar-DZ");
}

setInterval(updateClock, 1000);
updateClock();

function changeColor() {
  let colors = [
    "#0f2027",
    "#42275a",
    "#134e5e",
    "#642b36",
    "#1d4350"
  ];

  let color = colors[Math.floor(Math.random() * colors.length)];

  document.body.style.background = color;
}
</script>

</body>
</html>
